name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every push to main: build the release variant without signing, to catch breakage early.
  unsigned:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Check Trakt client ID
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: bash tools/trakt_ci_check.sh
      - name: Build (unsigned)
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_REDIRECT_URI: ${{ secrets.TRAKT_REDIRECT_URI || vars.TRAKT_REDIRECT_URI }}
        run: |
          [ -n "$TRAKT_CLIENT_ID" ] || echo "::warning title=No Trakt client ID::Secret TRAKT_CLIENT_ID is not set; this build shows \"Trakt not configured\"."
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: frost-flix-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

  # Tag v*: build, sign with the keystore from repository secrets, publish a GitHub release.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Missing signing secrets::These repository secrets are not set:$missing. Add them under Settings > Secrets and variables > Actions (see SETUP.md)."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check tag matches versionName
        run: |
          v=$(sed -n 's/^ *versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$v" ] || [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error title=Tag does not match the version::Tag is $GITHUB_REF_NAME, but app/build.gradle.kts has versionName '$v'. Tag this commit as v$v, or change versionName first."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches versionName $v"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error title=Bad keystore::KEYSTORE_BASE64 did not decode to a file. Re-create it as described in SETUP.md."
            exit 1
          fi
      - name: Check Trakt client ID
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: bash tools/trakt_ci_check.sh
      - name: Build (signed)
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_REDIRECT_URI: ${{ secrets.TRAKT_REDIRECT_URI || vars.TRAKT_REDIRECT_URI }}
        run: |
          [ -n "$TRAKT_CLIENT_ID" ] || echo "::warning title=No Trakt client ID::Secret TRAKT_CLIENT_ID is not set; this release shows \"Trakt not configured\"."
          ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error title=No signed APK::$apk was not produced. Check the build log above."
            exit 1
          fi
          cp "$apk" frost-flix.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Safe to re-run: if the release already exists, only its APK is replaced.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" frost-flix.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" frost-flix.apk \
              --repo "$GITHUB_REPOSITORY" --title "Frost-flix $GITHUB_REF_NAME" --generate-notes
          fi
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
